  </defs>

  <!-- Outer Squircle with glowing border -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="14" fill="url(#bgDark)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

