<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Deep CSND Navy Blue to Electric Blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2448"/>
      <stop offset="50%" stop-color="#1d5dbf"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Calendar Header: Gold Ribbon -->
    <linearGradient id="goldTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Number 5 Gradient: Pure Crisp White to Subtle Ice Tint -->
    <linearGradient id="numGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>

    <!-- Drop Shadows for 3D depth and pop at small sizes -->
    <filter id="fShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#040e1d" flood-opacity="0.45"/>
    </filter>
    <filter id="ringShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#78350f" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="none" stroke="rgba(255,255,255,0.28)" stroke-width="1.5"/>

  <!-- Top Calendar Header (Gold Ribbon) -->
  <path d="M 2 17 C 2 8.7 8.7 2 17 2 L 47 2 C 55.3 2 62 8.7 62 17 L 62 19 L 2 19 Z" fill="url(#goldTop)"/>

  <!-- Calendar Binder Rings -->
  <rect x="15" y="4" width="5.5" height="10" rx="2.75" fill="#ffffff" filter="url(#ringShadow)"/>
  <rect x="43.5" y="4" width="5.5" height="10" rx="2.75" fill="#ffffff" filter="url(#ringShadow)"/>

  <!-- T05 Header Text -->
  <text x="32" y="14.5" fill="#78350f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="7.5" text-anchor="middle" letter-spacing="1">T05</text>

  <!-- Big Bold Numeral 5 (Optimized for 16px to 512px visibility) -->
  <path d="
    M 21.5 25
    H 43.5
    V 31.5
    H 29.5
    L 28 37
    C 29.8 35.8 32.2 35.2 34.8 35.2
    C 41.8 35.2 46.5 39.4 46.5 46.2
    C 46.5 53.6 40.8 58 33 58
    C 25.5 58 21.2 53.4 20.2 48.2
    L 27.2 47.2
    C 27.8 50.1 30 52.2 33.2 52.2
    C 36.8 52.2 39.5 49.8 39.5 46
    C 39.5 42 36.6 39.8 32.8 39.8
    C 30 39.8 27.8 41 26.6 42.6
    L 21.5 41.2
    Z
  " fill="url(#numGrad)" filter="url(#fShadow)"/>
</svg>